services:
  api-email:
    build: .
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      APP_ENV: dev
      SERVICE_KEY_API_CORE: ${SERVICE_KEY_API_CORE:?Configure SERVICE_KEY_API_CORE in .env}
      SERVICE_KEY_API_AUTH: ${SERVICE_KEY_API_AUTH:-}
      SERVICE_KEY_GRAFANA: ${SERVICE_KEY_GRAFANA:-}
      ALERT_GRAFANA_URL: ${ALERT_GRAFANA_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_USER: ${JIRA_USER:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_FIELD_START: ${JIRA_FIELD_START:-}
      JIRA_FIELD_END: ${JIRA_FIELD_END:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_ALERT_TO: ${WHATSAPP_ALERT_TO:-}
      EMAIL_FROM: noreply@solaria.local
      EMAIL_ALLOWED_ORIGINS: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
