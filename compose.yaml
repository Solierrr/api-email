services:
  api-email:
    build: .
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      APP_ENV: dev
      SERVICE_KEY_API_CORE: ${SERVICE_KEY_API_CORE:?Configure SERVICE_KEY_API_CORE in .env}
      SERVICE_KEY_API_AUTH: ${SERVICE_KEY_API_AUTH:-}
      EMAIL_FROM: noreply@solaria.local
      EMAIL_ALLOWED_ORIGINS: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    depends_on:
      - mailpit
  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
