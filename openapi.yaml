        - INTERNAL_ERROR
      responses:
        "200":
          description: E-mail renderizado
          content:
            application/json:
              schema:
                description: E-mail renderizado
                type: object
                properties:
                  subject:
                    type: string
                    example: Confirme seu e-mail
                  html:
                    type: string
                  text:
                    type: string
                required:
                  - subject
                  - html
                  - text
                additionalProperties: false
        "400":
          description: "INVALID_ACTION_URL: link fora das origens permitidas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "UNAUTHENTICATED: chave de serviço ausente ou inválida"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "FORBIDDEN: serviço chamador não aceito nesta rota"
          content:
