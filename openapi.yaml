              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: "UNSUPPORTED_MEDIA_TYPE: corpo que não é JSON"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
