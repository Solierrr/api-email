servers:
  - url: https://api-email-6swz.onrender.com
    description: QA
  - url: http://localhost:8083
    description: Local
security:
  - serviceKey: []
tags:
  - name: E-mails
    description: Prévia e envio de e-mails transacionais.
  - name: Saúde
    description: Verificações de vivo e pronto usadas pela plataforma.
