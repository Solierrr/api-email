                actionUrl: https://web-app.example.com/pt-BR/verificar-email?token=exemplo
      x-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - INVALID_ACTION_URL
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
      responses:
        "200":
          description: E-mail renderizado
          content:
            application/json:
              schema:
                description: E-mail renderizado
                type: object
                properties:
                  subject:
                    type: string
                    example: Confirme seu e-mail
                  html:
                    type: string
                  text:
                    type: string
                required:
