                      pattern: ^[^\u0000-\u001f\u007f]+$
                    modelManufacturer:
                      type: string
                      minLength: 1
                      maxLength: 120
                      pattern: ^[^\u0000-\u001f\u007f]+$
                    modelPowerWatts:
                      type: integer
                      exclusiveMinimum: 0
                      maximum: 10000
                    modelImageUrl:
                      type: string
                      maxLength: 2048
                      format: uri
                    companyLogoUrl:
                      type: string
                      maxLength: 2048
                      format: uri
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1000
                      pattern: ^[^\u0000-\u001f\u007f]+$
                    actionUrl:
                      type: string
                      maxLength: 2048
                      format: uri
                    alertPriority:
                      type: string
                      enum:
                        - P1
                        - P2
