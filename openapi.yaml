                      maxLength: 2048
                      format: uri
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 1000
                      pattern: ^[^\u0000-\u001f\u007f]+$
                    actionUrl:
                      type: string
                      maxLength: 2048
                      format: uri
                  additionalProperties: false
              required:
                - template
