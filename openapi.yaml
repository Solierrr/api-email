  /alerts/jira:
    post:
      operationId: sendAlertJira
      summary: Cria e liga os tickets do Jira
      tags:
        - Alertas
      description: "Para cada alerta do ambiente configurado: `firing` cria um ticket
        novo (no mínimo 30 minutos depois do anterior do mesmo alerta, serviço e
        ambiente, e no máximo 8 em 24 horas), liga ao anterior e à escalada;
        `resolved` só grava o fim do incidente, sem mudar o status. Responde 503
        JIRA_REQUEST_FAILED para o Grafana tentar de novo."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrafanaWebhook"
      x-error-codes:
        - UNAUTHENTICATED
        - FORBIDDEN
        - VALIDATION_FAILED
        - MALFORMED_REQUEST
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CHANNEL_NOT_CONFIGURED
        - JIRA_REQUEST_FAILED
        - INTERNAL_ERROR
      responses:
        "200":
          description: Alertas processados
          content:
            application/json:
              schema:
                description: Alertas processados
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        alertId:
                          type: string
                          example: A03
                        service:
                          type: string
                          example: core
                        action:
                          type: string
                          enum:
                            - created
                            - skipped_interval
                            - ceiling_comment
                            - ignored_env
                            - end_recorded
                            - no_open_ticket
                        issueKey:
                          example: INC-12
                          type: string
                        issueKeys:
                          type: array
                          items:
                            type: string
                        warnings:
                          type: array
                          items:
                            type: string
                      required:
                        - alertId
                        - service
                        - action
                      additionalProperties: false
                required:
                  - results
                additionalProperties: false
        "401":
          description: "UNAUTHENTICATED: chave de serviço ausente ou inválida"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "FORBIDDEN: só o Grafana acessa estas rotas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "413":
          description: "PAYLOAD_TOO_LARGE: corpo maior que 256 KiB"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "415":
          description: "UNSUPPORTED_MEDIA_TYPE: corpo que não é JSON"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "422":
          description: "VALIDATION_FAILED: payload inválido (detalhes em errors);
            MALFORMED_REQUEST: JSON ilegível"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500":
          description: "INTERNAL_ERROR: erro interno inesperado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: "CHANNEL_NOT_CONFIGURED: canal sem chaves; JIRA_REQUEST_FAILED: o
            Jira recusou ou não respondeu"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
